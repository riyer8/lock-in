<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">LOCK IN snowflake icon</title>
  <desc id="desc">A soft lavender snowflake mark on a calm dark winter background.</desc>
